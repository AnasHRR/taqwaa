 Ta majesté et il n'y a d'autre divinité que Toi.",6:"Seigneur pardonne-moi, Seigneur pardonne-moi.",7:"Ô Allah ! Guide-moi parmi ceux que Tu as guidés, accorde-moi le salut parmi ceux à qui Tu l'as accordé, et prends-moi sous Ta protection.",8:"Allah ! Point de divinité à part Lui, le Vivant, Celui qui subsiste par Lui-même 'Al-Qayyum'. Ni somnolence ni sommeil ne Le saisissent.",9:"Au nom d'Allah, je place ma confiance en Allah. Il n'y a de force ni de puissance que par Allah.",10:"Au nom d'Allah et avec la bénédiction d'Allah.",11:"Louange à Allah qui m'a nourri de ceci et me l'a accordé sans force ni puissance de ma part.",12:"Ô Allah, ouvre-moi les portes de Ta miséricorde.",13:"Au nom d'Allah, avec le Nom duquel rien ne peut nuire sur la terre ni dans le ciel, et Il est l'Audient, l'Omniscient.",14:"Allah me suffit ! Il n'y a de divinité que Lui. En Lui je place ma confiance, et Il est le Seigneur du Trône Immense.",15:"Dis : 'Je cherche protection auprès du Seigneur de l'aube naissante, contre le mal des êtres qu'Il a créés...'"},tasbeehPhrases:[{text:"سُبْحَانَ اللَّهِ",sub:"SubhanAllah",meaning:"Gloire et pureté à Allah"},{text:"الْحَمْدُ لِلَّهِ",sub:"Alhamdulillah",meaning:"Louange à Allah"},{text:"اللَّهُ أَكْبَرُ",sub:"Allahu Akbar",meaning:"Allah est le Plus Grand"}],emptyFavorites:"Aucun dhikr ajouté aux favoris pour le moment.",emptyCategory:"Aucun dhikr trouvé dans cette catégorie.",countBadge:"Répétitions",tasbeehBtn:"Glorifier"},about:{title:"À propos de Taqwaaa",tagline:"Plateforme islamique moderne et apaisante",verse:"Et rappelle, car le rappel profite aux croyants.",verseRef:"Sourate Ad-Dhariyat 55",description:"Taqwaaa est une plateforme islamique marocaine moderne conçue pour offrir un compagnon spirituel fiable, pur et élégant. Nous réunissons les horaires de prière précis pour le Maroc, le Saint Coran complet et la citadelle du musulman (Adhkar) dans une interface fluide, rapide et sans publicité.",whatWeOfferTitle:"Conçu pour la dévotion" ed at nightfall.",steps:["Intention and Opening Takbir","First 2 units recited aloud (Al-Fatiha + surah)","First Tashahhud","Last 2 units recited silently","Final Tashahhud, blessings, and Taslim"],virtues:"Praying Isha in congregation is equivalent to spending half the night in prayer.",time:"From the fading of twilight until midnight."}},wuduSteps:[{step:1,title:"Intention & Bismillah",desc:"Form the sincere intention in your heart and say 'Bismillah'."},{step:2,title:"Wash Hands",desc:"Wash both hands up to the wrists three times."},{step:3,title:"Rinse Mouth (Madmadah)",desc:"Rinse your mouth thoroughly with water three times."},{step:4,title:"Inhale Water into Nose (Istinshaq)",desc:"Gently sniff water into the nostrils and blow it out three times."},{step:5,title:"Wash Face",desc:"Wash the entire face from hairline to chin and ear to ear three times."},{step:6,title:"Wash Arms up to Elbows",desc:"Wash the right arm then the left arm up to the elbows three times."},{step:7,title:"Wipe Head",desc:"Wipe your wet hands over your head from front to back once."},{step:8,title:"Wipe Ears",desc:"Wipe the inner and outer parts of both ears once."},{step:9,title:"Wash Feet up to Ankles",desc:"Wash the right foot then left foot including the ankles three times."}],conditionsList:[{title:"Ritual Purity (Taharah)",desc:"Being in a state of Wudu and ensuring the purity of body, clothing, and place."},{title:"Facing the Qibla",desc:"Facing towards the Noble Kaaba in Makkah."},{title:"Covering the 'Awrah",desc:"Wearing modest, lawful clothing according to Islamic guidelines."},{title:"Entry of Prayer Time",desc:"Ensuring that the appointed time for the specific prayer has arrived."},{title:"Sincere Intention (An-Niyyah)",desc:"Making the sincere intention for the prayer in your heart solely for Allah."}]},quran:{title:"The Noble Quran",subtitle:"The Holy Quran · 114 Surahs",searchPlaceholder:"Search surah by name, translation or number...",dailyVerseTitle:"Daily Ayah",filterA
